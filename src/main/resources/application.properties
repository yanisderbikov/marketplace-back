server.port=8090
allowed.origins=${ALLOWED_ORIGINS}
front.url=${FRONT_URL}
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.task.scheduling.pool.size=3
s3.bucket.name=${S3_BUCKET_NAME}
s3.region=${S3_REGION}
s3.endpoint=${S3_ENDPOINT}
s3.access-key-id=${S3_ACCESS_KEY_ID}
s3.secret-access-key=${S3_SECRET_ACCESS_KEY}
s3.cors.auto=${S3_CORS_AUTO}
jwt.secret=${JWT_SECRET}
jwt.expiration.seconds=${JWT_EXPIRATION_SECONDS}
admin.super.emails=${ADMIN_SUPER_EMAILS}
auth.login-code.secret=${AUTH_LOGIN_CODE_SECRET}
auth.login-code.ttl-minutes=10
auth.login-code.resend-seconds=60
auth.login-code.max-attempts=5
auth.login-code.max-fails-per-day=20
auth.login-code.ip-limit-per-hour=20
auth.login-code.verify-ip-limit-per-hour=30
email.notisend.api.key=${EMAIL_NOTISEND_API_KEY}
email.notisend.email.address=${EMAIL_NOTISEND_EMAIL_ADDRESS}
email.notisend.from.name=${EMAIL_NOTISEND_FROM_NAME}
sdek.tariff.code=${SDEK_TARIFF_CODE}
payment.tinkoff.api.url=${PAYMENT_TINKOFF_API_URL}
payment.tinkoff.notification-url=${PAYMENT_TINKOFF_NOTIFICATION_URL}
payment.secrets.key=${PAYMENT_SECRETS_KEY}
payment.allowed-return-hosts=${PAYMENT_ALLOWED_RETURN_HOSTS}
payment.pending-check.interval-ms=${PAYMENT_PENDING_CHECK_INTERVAL_MS}
domains.provisioner=${DOMAIN_PROVISIONER}
domains.static.cname-target=${DOMAIN_CNAME_TARGET:}
domains.static.a-record-ip=${DOMAIN_A_RECORD_IP:}
domains.railway.api-url=https://backboard.railway.com/graphql/v2
domains.railway.token=${RAILWAY_API_TOKEN:}
domains.railway.token-kind=${RAILWAY_API_TOKEN_KIND:}
domains.railway.project-id=${RAILWAY_PROJECT_ID:}
domains.railway.environment-id=${RAILWAY_ENVIRONMENT_ID:}
domains.railway.service-id=${RAILWAY_GATEWAY_SERVICE_ID:}
domains.railway.target-port=${RAILWAY_GATEWAY_PORT:}
springdoc.api-docs.path=/v3/api-docs
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
